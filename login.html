<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS RESUME — ACCESS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050508;
      --bg2: #0a0a12;
      --bg3: #0d0d1a;
      --cyan: #00e5ff;
      --purple: #8b5cf6;
      --pink: #f72585;
      --green: #39ff14;
      --text: #f0f0ff;
      --text2: #8888aa;
      --border: rgba(0,229,255,0.2);
      --glow-cyan: 0 0 20px rgba(0,229,255,0.4);
      --glow-purple: 0 0 20px rgba(139,92,246,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated grid background */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridScroll 20s linear infinite;
    }
    @keyframes gridScroll {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    .grid-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, var(--bg) 80%);
    }

    /* Floating orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
    }
    .orb-1 { width: 500px; height: 500px; background: rgba(0,229,255,0.06); top: -100px; left: -100px; animation: float1 8s ease-in-out infinite; }
    .orb-2 { width: 400px; height: 400px; background: rgba(139,92,246,0.08); bottom: -80px; right: -80px; animation: float2 10s ease-in-out infinite; }
    .orb-3 { width: 300px; height: 300px; background: rgba(247,37,133,0.05); top: 50%; left: 60%; animation: float3 12s ease-in-out infinite; }

    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,30px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-20px)} }
    @keyframes float3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,30px)} }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 48px; height: 48px;
      border: 2px solid var(--cyan);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      clip-path: polygon(10% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0% 90%, 0% 10%);
      background: rgba(0,229,255,0.1);
      box-shadow: var(--glow-cyan);
    }

    .logo-icon svg { width: 24px; height: 24px; color: var(--cyan); }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--text);
    }

    .logo-text span { color: var(--cyan); }

    .logo-sub {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 36px;
      position: relative;
      box-shadow: 0 0 40px rgba(0,229,255,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Corner decorations */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
      gap: 0;
    }

    .tab-btn {
      flex: 1;
      background: none; border: none; cursor: pointer;
      color: var(--text2);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 12px 0;
      text-transform: uppercase;
      transition: all 0.3s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    .tab-btn:hover:not(.active) { color: var(--text); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s;
    }

    .form-input::placeholder { color: rgba(136,136,170,0.4); }
    .form-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(0,229,255,0.2), var(--glow-cyan);
      background: rgba(0,229,255,0.03);
    }

    .btn-primary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--cyan);
      transform: translateX(-100%);
      transition: transform 0.3s;
      z-index: -1;
    }

    .btn-primary:hover {
      color: var(--bg);
      box-shadow: var(--glow-cyan);
    }
    .btn-primary:hover::before { transform: translateX(0); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      color: var(--text2);
      font-size: 11px;
      letter-spacing: 2px;
      font-family: 'Space Mono', monospace;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(139,92,246,0.4);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      letter-spacing: 1px;
    }

    .btn-google:hover {
      border-color: var(--purple);
      color: var(--purple);
      box-shadow: var(--glow-purple);
    }

    .btn-google svg { width: 18px; height: 18px; }

    .alert {
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      margin-bottom: 16px;
      display: none;
      letter-spacing: 0.5px;
    }

    .alert.error {
      background: rgba(247,37,133,0.1);
      border: 1px solid rgba(247,37,133,0.4);
      color: var(--pink);
      display: block;
    }

    .alert.success {
      background: rgba(57,255,20,0.08);
      border: 1px solid rgba(57,255,20,0.3);
      color: var(--green);
      display: block;
    }

    .loading-dots {
      display: inline-flex; gap: 4px; align-items: center;
    }
    .loading-dots span {
      width: 5px; height: 5px;
      background: var(--cyan);
      border-radius: 50%;
      animation: blink 1s step-start infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }

    .status-line {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text2);
      margin-top: 24px;
      letter-spacing: 1px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100%{opacity:1} 50%{opacity:0.4}
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-container">
    <div class="logo-area">
      <div class="logo-badge">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div class="logo-text">NEX<span>US</span></div>
      </div>
      <div class="logo-sub">AI Resume System v2.0</div>
    </div>

    <div class="card">
      <div id="alertBox" class="alert"></div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Access</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Tab -->
      <div id="tab-login" class="tab-content active">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">Identity</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="user@domain.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Auth Key</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••" required />
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">
            INITIALIZE SESSION
          </button>
        </form>

        <div class="divider">OR</div>

        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Register Tab -->
      <div id="tab-register" class="tab-content">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">Display Name</label>
            <input type="text" id="regName" class="form-input" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label class="form-label">Identity</label>
            <input type="email" id="regEmail" class="form-input" placeholder="user@domain.com" required />
          </div>
          <div class="form-group">
            <label class="form-label">Auth Key</label>
            <input type="password" id="regPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6" />
          </div>
          <button type="submit" class="btn-primary" id="registerBtn">
            CREATE ACCOUNT
          </button>
        </form>

        <div class="divider">OR</div>

        <button class="btn-google" onclick="handleGoogleLogin()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="status-line">
        <div class="status-dot"></div>
        <span>SYSTEM ONLINE — FIREBASE AUTH ACTIVE</span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="data/config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = 'alert ' + type;
    }

    function setLoading(btnId, loading, text) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? `<span class="loading-dots"><span></span><span></span><span></span></span>`
        : text;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === (tab === 'login' ? 0 : 1)));
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('alertBox').className = 'alert';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      setLoading('loginBtn', true);
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message.replace('Firebase: ', ''));
        setLoading('loginBtn', false, 'INITIALIZE SESSION');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      setLoading('registerBtn', true);
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message.replace('Firebase: ', ''));
        setLoading('registerBtn', false, 'CREATE ACCOUNT');
      }
    }

    async function handleGoogleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message.replace('Firebase: ', ''));
      }
    }

    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
